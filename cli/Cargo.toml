[package]
name = "rbelote-cli"
description = "Terminal front-end for the belote engine"
default-run = "rbelote"
version.workspace = true
authors.workspace = true
edition.workspace = true

[[bin]]
name = "rbelote"
path = "src/main.rs"

[dependencies]
rbelote-core.workspace = true
rand.workspace = true
strum.workspace = true
tracing.workspace = true
tracing-subscriber = "0.3"
inquire = "0.9.1"
clap = { version = "4.0", features = ["derive"] }
color-eyre = "0.6.2"
colored = "3.0.0"

[lints]
workspace = true
